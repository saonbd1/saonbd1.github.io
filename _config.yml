# Root site of https://saonbd1.github.io
#
# The Light SEO Tools site no longer lives in this repository. It moved to
# https://github.com/saonbd1/light-seo-tools and is published as a project site
# at https://saonbd1.github.io/light-seo-tools/
#
# What is left here is the domain root: static redirect stubs that keep the old
# URLs alive (see scripts/make_root_redirects.rb) plus the Google Search Console
# verification file. Replace index.html with the real root site when it is ready,
# but keep the stubs so old links and search results keep working.

title: saonbd1.github.io
description: Root site of the saonbd1.github.io domain.
url: "https://saonbd1.github.io"
baseurl: ""
lang: en

# Keep tooling and repository documentation out of the published output.
exclude:
  - "scripts"
  - "docs"
  - "README.md"
  - "Gemfile"
  - "Gemfile.lock"
